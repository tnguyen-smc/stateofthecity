<script>

/* ════════════════════════════════════════════════════════════════════════════
   UTILITIES
   ════════════════════════════════════════════════════════════════════════════ */
const $  = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const fmt = n => (n < 0 ? '-$' : '$') + Math.round(Math.abs(n)).toLocaleString('en-US');
const fmtShort = n => {
  const a = Math.abs(n);
  if (a >= 1e6) return '$' + (n / 1e6).toFixed(n % 1e6 === 0 ? 0 : 1) + 'M';
  if (a >= 1e3) return '$' + Math.round(n / 1e3) + 'K';
  return '$' + n;
};
const uid = () => Math.random().toString(36).slice(2, 9);
const genCode = () => { const a = 'ABCDEFGHJKMNPQRSTUVWXYZ'; let c = ''; for (let i = 0; i < 4; i++) c += a[Math.floor(Math.random() * a.length)]; return c; };
const cleanCode = s => String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6);
const slug = s => String(s).toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'table';
const timeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]);
const toArr = v => Array.isArray(v) ? v.filter(Boolean) : (v && typeof v === 'object') ? Object.keys(v).sort((a, b) => a - b).map(k => v[k]) : [];
const hash = str => { let h = 5381; for (let i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) | 0; return Math.abs(h); };
const natSort = (a, b) => a.name.localeCompare(b.name, undefined, { numeric: true });
const clone = o => JSON.parse(JSON.stringify(o));

const mem = {};
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return k in mem ? mem[k] : d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { mem[k] = v; } },
  del(k) { try { localStorage.removeItem(k); } catch { delete mem[k]; } }
};

/* URL routing: the table page lives at join.html (→ index.html?join) */
const QS = new URLSearchParams(location.search);
const JOIN_MODE = QS.has('join') || QS.has('code') || /join=/i.test(location.hash) || /join/i.test(location.pathname.split('/').pop() || '');
const URL_CODE = cleanCode(QS.get('code') || QS.get('join') || (location.hash.match(/join=([A-Za-z0-9]+)/) || [])[1] || '');
const joinPageURL = () => new URL('join.html', location.href).href;
const joinDirectURL = code => location.origin + location.pathname + '?join&code=' + encodeURIComponent(code);

function logoFail(img) {
  const s = document.createElement('span');
  s.className = 'wordmark text-slate-600 text-2xl'; s.textContent = 'Our City';
  img.replaceWith(s);
}
const logoImg = (h = 48) => `<img src="${LOGO_SRC}" alt="Our City" class="block object-contain" style="height:${h}px;width:auto;max-width:100%" onerror="logoFail(this)">`;

function iconHTML(icon) {
  const s = String(icon || '📦');
  if (/^(https?:\/\/|data:image\/)/i.test(s))
    return `<img class="ico-img" src="${esc(s)}" alt="" referrerpolicy="no-referrer" onerror="this.replaceWith(document.createTextNode('📦'))">`;
  return `<span>${esc(s)}</span>`;
}
function setHTML(el, html) { if (el && el._h !== html) { el._h = html; el.innerHTML = html; } }

function toast(msg, kind = 'info') {
  const t = document.createElement('div');
  t.className = 'fixed left-1/2 -translate-x-1/2 bottom-6 z-[100] px-5 py-3 rounded-xl text-sm font-semibold shadow-2xl pop max-w-[92vw] text-center ' +
    (kind === 'error' ? 'bg-rose-600 text-white' : 'bg-slate-900 text-white');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 4200);
}
function loadScript(src) {
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = src; s.onload = res; s.onerror = () => rej(new Error('Could not load ' + src));
    document.head.appendChild(s);
  });
}
function copyText(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => toast('Link copied'), () => prompt('Copy this link:', text));
  else prompt('Copy this link:', text);
}
function setMoney(el, val) {
  if (!el) return;
  if (el._v === undefined) { el._v = val; el.textContent = fmt(val); return; }
  if (el._v === val) return;
  const from = el._v, to = val; el._v = val;
  const t0 = performance.now(); cancelAnimationFrame(el._raf);
  const step = t => {
    const p = Math.min(1, (t - t0) / 800), e = 1 - Math.pow(1 - p, 3);
    el.textContent = fmt(from + (to - from) * e);
    if (p < 1) el._raf = requestAnimationFrame(step);
  };
  el._raf = requestAnimationFrame(step);
}

/* Sound + confetti (host only) */
let soundOn = store.get('civic:sound', true);
let actx = null;
function beep(freq = 660, dur = .12, type = 'sine', vol = .08) {
  if (!soundOn) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq; g.gain.value = vol;
    o.connect(g); g.connect(actx.destination); o.start();
    g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime + dur); o.stop(actx.currentTime + dur);
  } catch {}
}
function chime(ok) { (ok ? [523, 659, 784, 1046] : [330, 262]).forEach((f, i) => setTimeout(() => beep(f, .28, ok ? 'triangle' : 'sawtooth', ok ? .1 : .05), i * 130)); }
function confetti(n = 80) {
  const colors = ['#8dc63f', '#29abe2', '#f5a81c', '#c2377f', '#7b3f98', '#f7941d'];
  const box = document.createElement('div');
  box.className = 'fixed inset-0 pointer-events-none z-[90] overflow-hidden';
  for (let i = 0; i < n; i++) {
    const p = document.createElement('i');
    p.style.cssText = `position:absolute;top:-24px;left:${Math.random() * 100}%;width:${6 + Math.random() * 8}px;height:${10 + Math.random() * 10}px;` +
      `background:${colors[i % colors.length]};border-radius:2px;--dx:${(Math.random() - .5) * 320}px;--rot:${Math.random() * 900}deg;` +
      `animation:confetti ${2.2 + Math.random() * 1.8}s ${Math.random() * .6}s cubic-bezier(.3,.6,.4,1) forwards`;
    box.appendChild(p);
  }
  document.body.appendChild(box);
  setTimeout(() => box.remove(), 5200);
}

/* ════════════════════════════════════════════════════════════════════════════
   FIREBASE TRANSPORT  (Realtime Database, rooms/<CODE>/…)
   ════════════════════════════════════════════════════════════════════════════ */
class FirebaseTransport {
  constructor(code) {
    this.code = code; this.offset = 0; this.connected = false; this.connCbs = [];
    const app = firebase.apps.length ? firebase.app() : firebase.initializeApp({ databaseURL: FIREBASE_URL });
    this.db = firebase.database(app);
    this._offRef = this.db.ref('.info/serverTimeOffset'); this._offRef.on('value', s => { this.offset = s.val() || 0; });
    this._conRef = this.db.ref('.info/connected');
    this._conRef.on('value', s => { this.connected = !!s.val(); this.connCbs.forEach(f => f(this.connected)); });
  }
  now() { return Date.now() + this.offset; }
  ref(p) { return this.db.ref('rooms/' + this.code + (p ? '/' + p : '')); }
  set(p, v) { return v == null ? this.ref(p).remove() : this.ref(p).set(JSON.parse(JSON.stringify(v))); }
  get(p) { return this.ref(p).once('value').then(s => s.val()); }
  on(p, cb) { const r = this.ref(p), h = s => cb(s.val()); r.on('value', h); return () => r.off('value', h); }
  onConnection(cb) { this.connCbs.push(cb); cb(this.connected); }
  close() { this.connCbs = []; try { this._offRef.off(); this._conRef.off(); } catch {} }
}
async function createTransport(code) {
  if (!(window.firebase && firebase.apps)) {
    await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js');
    await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js');
  }
  return new FirebaseTransport(code);
}

/* ════════════════════════════════════════════════════════════════════════════
   SHARED GAME LOGIC
   ════════════════════════════════════════════════════════════════════════════ */
const remaining = s => s.startingBudget - s.spent;
function normalizeState(s) {
  if (!s || typeof s !== 'object') return null;
  s.queue = toArr(s.queue); s.placed = toArr(s.placed); s.decisions = toArr(s.decisions);
  s.spent = s.spent || 0; s.idx = s.idx || 0; s.extraRows = s.extraRows || 0;

}

function gridDims(s) {
  const tiles = s.queue.reduce((a, q) => a + (q.tiles || 1), 0) + s.placed.filter(p => p.base).length;
  const maxSlot = s.placed.reduce((m, p) => Math.max(m, p.slot == null ? -1 : p.slot), -1);
  const rows = Math.max(5, Math.ceil(tiles / COLS), Math.ceil((maxSlot + 1) / COLS)) + (s.extraRows || 0);

}

    { r: m,     c: 3, name: 'City Hall',       icon: '🏛️', category: 'Other' },

}
/** Empty slots, nearest-to-centre first (used by Auto-place). */

  const { rows } = gridDims(s), occ = new Set(s.placed.map(p => p.slot));

}

      }

        if (!(draft.budget > 0)) { toast('Set a starting budget above $0', 'error'); return; }
        if (!draft.queue.length) { toast('Add at least one project to the vote queue', 'error'); return; }

        const queue = draft.queue.map(fromLib);
        const tmp = { queue, placed: draft.baseline ? [0, 0, 0, 0].map(() => ({ base: true })) : [], extraRows: 0 };
        const rows = gridDims(tmp).rows;

      }
    }
    save(); renderLib(); renderQueue();
  };
  app.addEventListener('click', onClick);
  teardown.push(() => app.removeEventListener('click', onClick));
}

/* ════════════════════════════════════════════════════════════════════════════

async function showHost(code, initial, isNew) {

      await timeout(transport.set('tables', null), 9000); await timeout(transport.set('votes', null), 9000);
      await timeout(transport.set('state', state), 9000);
    } else {
      state = normalizeState(await timeout(transport.get('state'), 9000));

    const now = transport.now();

  /* ---- skeleton ---- */

  function commit(fn) {

  function startVote() {

  function finishedOverlay() {
    const ok = state.decisions.filter(d => d.passed), no = state.decisions.filter(d => !d.passed);
    return `<div class="fixed inset-0 z-[70] grid place-items-center p-4 md:p-8 bg-slate-950/80 backdrop-blur-md fade-in">

  function renderConn() {
    const n = tableList().filter(t => t.online).length;

  }
  function renderAll() { renderBudget(); renderItem(); renderVote(); renderNext(); renderCity(); renderBar(); renderOverlay(); renderConn(); }

  /* ---- timer / loop ---- */
  function tick(renderOnly) {
    const now = transport.now();
    if (state.phase === 'voting') {
      const left = Math.max(0, state.endsAt - now), sec = Math.ceil(left / 1000);
      const t = $('#vTime'); if (t) { t.textContent = sec; t.className = t.className.replace(/text-(white|rose-300)/, sec <= 10 ? 'text-rose-300' : 'text-white'); }
      const b = $('#vBar'); if (b) { b.style.width = (left / (state.durationMs || 1) * 100) + '%'; b.className = 'h-full rounded-full ' + (sec <= 10 ? 'bg-rose-400' : 'bg-emerald-400'); }
      if (renderOnly) return;
      if (sec <= 5 && sec > 0 && sec !== lastBeep) { lastBeep = sec; beep(880, .08, 'square', .04); }
      if (left <= 0) { endVote(); return; }
      if (state.autoEnd) {
        const voted = Object.keys(votes?.[state.voteId] || {}).length, online = tableList().filter(x => x.online).length;
        if (voted > 0 && voted >= online) { if (!allVotedAt) allVotedAt = now; else if (now - allVotedAt > 1200) endVote(); } else allVotedAt = 0;
      }
    }
    if (!renderOnly && performance.now() - lastSlow > 1500) { lastSlow = performance.now(); renderVote(); renderConn(); }
  }

  /* ---- listeners ---- */
  teardown.push(transport.on('tables', v => { tables = v || {}; renderVote(); renderConn(); }));
  teardown.push(transport.on('votes', v => { votes = v || {}; renderVote(); }));
  transport.onConnection(c => { connected = c; renderConn(); });
  const beat = () => Promise.resolve(transport.set('hostSeen', transport.now())).catch(() => {});
  beat(); const hb = setInterval(beat, HEARTBEAT_MS); teardown.push(() => clearInterval(hb));
  const loop = setInterval(() => tick(false), 200); teardown.push(() => clearInterval(loop));

  const onChange = e => { if (e.target.id === 'vDur') durSec = +e.target.value; };
  const onClick = e => {
    const cell = e.target.closest('[data-cell]');
    if (cell) { cellClick(+cell.dataset.cell); return; }
    const b = e.target.closest('[data-act]'); if (!b) return;
    b.blur && b.blur();
    switch (b.dataset.act) {
      case 'start': startVote(); break;
      case 'end': endVote(); break;
      case 'continue': afterResult(); break;
      case 'autoplace': if (state.phase === 'result') startPlacing(true); else autoPlaceRest(); break;
      case 'doneplace': donePlacing(); break;
      case 'cancelmove': moveSel = null; renderCity(); renderBar(); break;
      case 'addrow': addRow(); break;
      case 'delrow': delRow(); break;
      case 'sound': soundOn = !soundOn; store.set('civic:sound', soundOn); renderConn(); beep(660); break;

  teardown.push(() => { app.removeEventListener('click', onClick); app.removeEventListener('change', onChange); document.removeEventListener('keydown', onKey); });

  function openMenu() {
    const m = openModal(`<div class="p-6">

        <button id="mSkip" class="btn btn-light w-full !justify-start">↷ Skip current item (move it to the end of the queue)</button>

/* ════════════════════════════════════════════════════════════════════════════

async function showTable(code, name) {
  cleanup();
  app.innerHTML = splash('Joining room ' + code + '…');
  let transport, state;
  try { transport = await createTransport(code); teardown.push(() => transport.close()); }
  catch (e) { showLanding('Could not start sync: ' + e.message); return; }
  try { state = normalizeState(await timeout(transport.get('state'), 9000)); }
  catch { showLanding('Could not reach the room. Check your connection and try again.'); return; }
  if (!state) { showLanding(`Room ${code} wasn’t found. Check the code on the main screen.`); return; }
  store.set('civic:lastTable', { code, name });
  const tid = slug(name);
  const lockKey = vid => `civic:vote:${code}:${vid}:${tid}`;
  let hostSeen = 0, connected = true, remoteVote = null, voteKey = null, unsubMine = null, acked = null, wasOver = false, lastHostOn = null;

  const reg = () => Promise.resolve(transport.set('tables/' + tid, { name, lastSeen: transport.now() })).catch(() => {});
  reg(); const hb = setInterval(reg, HEARTBEAT_MS); teardown.push(() => clearInterval(hb));
  teardown.push(() => unsubMine && unsubMine());

  const myVote = () => (state && state.voteId && store.get(lockKey(state.voteId), null)) || remoteVote;
  const hostOnline = () => transport.now() - hostSeen < STALE_MS;

  function syncMine() {
    if (!state || state.voteId === voteKey) return;
    unsubMine && unsubMine(); voteKey = state.voteId; remoteVote = null; acked = null;
    if (voteKey) unsubMine = transport.on(`votes/${voteKey}/${tid}`, v => { remoteVote = v || null; if (v) acked = voteKey; render(); });
  }

  app.innerHTML = `<div id="tRoot" class="min-h-screen bg-grid"></div>`;
  const root = $('#tRoot');

  function header() {
    const on = connected && hostOnline();
    return `<header class="flex items-center justify-between gap-3 px-4 pt-[max(1rem,env(safe-area-inset-top))] pb-3">
      <div class="flex items-center gap-2 min-w-0"><span class="chip bg-emerald-400 text-emerald-950 !text-sm !px-3 !py-1 truncate max-w-[12rem]">${esc(name)}</span><span class="num text-slate-700 font-bold tracking-widest">${esc(code)}</span></div>
      <div class="flex items-center gap-3"><span class="inline-flex items-center gap-1.5 text-xs font-semibold ${on ? 'text-emerald-700' : 'text-amber-600'}"><span class="w-2 h-2 rounded-full ${on ? 'bg-emerald-400' : 'bg-amber-400 animate-pulse'}"></span>${!connected ? 'Reconnecting…' : hostOnline() ? 'Connected' : 'Host offline'}</span>
      <button data-act="leave" class="text-xs text-slate-500 underline">Leave</button></div></header>
      <div class="px-4 pb-3 text-center flex flex-col items-center">${logoImg(52)}<div class="wordmark text-lg text-slate-600 truncate max-w-full mt-2">${esc(state.title)}</div></div>`;
  }

      <div class="flex justify-between items-end gap-3">
        <div><div class="text-xs font-semibold text-slate-500">City budget remaining</div><div class="num text-4xl md:text-5xl font-bold ${rem <= 0 ? 'text-rose-600' : 'text-emerald-600'}">${fmt(rem)}</div></div>
        <div class="text-right"><div class="text-xs font-semibold text-slate-500">Spent</div><div class="num text-xl font-bold text-rose-600">${fmt(state.spent)}</div></div>
      </div>

  }
  function itemHeader(it) {
    const c = catColor(it.category);
    return `<div class="flex items-center gap-4"><div class="w-16 h-16 text-4xl shrink-0 rounded-2xl grid place-items-center" style="background:${c}1f;border:2px solid ${c}66">${iconHTML(it.icon)}</div>

  }

  }

  function body() {
    const s = state, it = s.queue[s.idx];
    const mine = myVote();

    if (s.phase === 'voting' && it) {
      const rem = remaining(s), after = rem - it.cost, pct = Math.min(999, Math.round(it.cost / Math.max(rem, 1) * 100));
      const over = transport.now() >= s.endsAt;
      let action;
      if (mine) {
        action = `<div class="card p-6 text-center pop flex-1 grid place-items-center">
          <div><div class="check-pop mx-auto w-24 h-24 rounded-full grid place-items-center text-6xl text-white ${mine === 'yes' ? 'bg-emerald-500' : 'bg-rose-500'}">✓</div>

      } else if (over) {

      } else {
        action = `<div class="grid grid-cols-2 gap-4 flex-1 min-h-[42vh]">

          <button data-act="no" class="vote-btn bg-rose-500 text-4xl md:text-6xl"><span class="text-6xl md:text-8xl leading-none">👎</span>NO<span class="text-sm md:text-lg font-semibold opacity-90">Pass on it</span></button></div>`;

            <div class="rounded-2xl ${after < 0 ? 'bg-amber-50' : 'bg-emerald-50'} p-3"><div class="text-xs font-semibold text-slate-500">Left if approved</div><div class="num text-2xl font-bold ${after < 0 ? 'text-amber-600' : 'text-emerald-600'}">${after < 0 ? 'Over budget' : fmt(after)}</div></div>
          </div>
          <div class="flex items-center gap-3 mt-4"><div class="num text-2xl font-bold w-12" id="tTime">--</div><div class="flex-1 h-3 rounded-full bg-slate-200 overflow-hidden"><div id="tBar" class="h-full rounded-full bg-emerald-500" style="width:100%"></div></div></div></div>
        ${action}`;
    }

    if ((s.phase === 'result' || s.phase === 'placing') && s.result) {
      const r = s.result;
      return `<div class="rounded-[2rem] overflow-hidden pop ${r.passed ? 'bg-emerald-500' : 'bg-rose-500'} text-white p-6 text-center shadow-2xl">
          <div class="text-6xl">${r.passed ? '🎉' : '✋'}</div>
          <div class="font-display text-4xl md:text-5xl font-semibold mt-1">${r.passed ? 'Passed!' : 'Did not pass'}</div>
          <div class="font-semibold opacity-95 mt-1">${esc(r.reason)}</div></div>
        <div class="card p-5 pop">${itemHeader(r)}
          <div class="grid grid-cols-2 gap-3 mt-4">
            <div class="rounded-2xl bg-emerald-50 p-3 text-center"><div class="text-xs font-bold text-emerald-700">Yes</div><div class="num text-4xl font-bold text-emerald-600">${r.yes}</div></div>
            <div class="rounded-2xl bg-rose-50 p-3 text-center"><div class="text-xs font-bold text-rose-700">No</div><div class="num text-4xl font-bold text-rose-600">${r.no}</div></div></div>
          <div class="text-sm text-slate-500 mt-3 text-center">${mine ? `Your table voted <b class="${mine === 'yes' ? 'text-emerald-600' : 'text-rose-600'}">${mine.toUpperCase()}</b>` : 'Your table didn’t vote on this one'} · ${r.passed ? `${fmt(r.cost)} spent` : 'Budget unchanged'}</div>
          ${s.phase === 'placing' ? '<div class="text-sm font-semibold text-emerald-700 mt-2 text-center">The host is choosing where it goes in the city…</div>' : ''}</div>
        ${budgetCard()}`;
    }

    if (s.phase === 'finished') {
      return `<div class="card p-6 text-center pop"><div class="text-6xl">🏆</div><h2 class="font-display text-3xl font-semibold mt-2">Session complete</h2>
        <p class="text-slate-500 mt-1">${builtItems(s).length} ${builtItems(s).length === 1 ? 'project was' : 'projects were'} funded, and ${fmt(remaining(s))} is left.</p></div>${budgetCard()}`;
    }

    const last = s.result && s.decisions.length
      ? `<div class="panel p-4 flex items-center gap-3"><span class="text-2xl">${s.result.passed ? '✅' : '❌'}</span><div class="min-w-0"><div class="text-xs font-semibold text-slate-300">Last decision</div><div class="font-semibold text-white truncate">${esc(s.result.name)} ${s.result.passed ? 'passed' : 'did not pass'} (${s.result.yes}–${s.result.no})</div></div></div>` : '';
    return `${budgetCard()}
      <div class="card p-6 text-center pop"><div class="text-5xl mb-2">⏳</div><h2 class="font-display text-2xl font-semibold">Waiting for the next vote</h2>
        <p class="text-slate-500 mt-1">Keep this screen open. It updates the moment the host starts.</p>
        ${it ? `<div class="mt-4 rounded-2xl bg-slate-100 p-3 flex items-center gap-3 text-left"><span class="text-3xl">${iconHTML(it.icon)}</span><div class="min-w-0"><div class="text-xs font-semibold text-slate-500">Up next</div><div class="font-bold truncate">${esc(it.name)}</div></div><div class="num font-bold ml-auto">${fmtShort(it.cost)}</div></div>` : ''}</div>${last}`;
  }

  function render() {
    if (!state) { setHTML(root, `<div class="min-h-screen grid place-items-center p-6 text-center"><div><div class="text-5xl mb-3">👋</div><div class="text-slate-700 font-display text-2xl font-semibold">The host closed this session</div><button data-act="leave" class="btn btn-green mt-5">Back to home</button></div></div>`); return; }
    setHTML(root, `<div class="min-h-screen flex flex-col max-w-xl md:max-w-2xl mx-auto w-full">${header()}<main class="flex-1 flex flex-col gap-4 px-4 pb-[max(1.5rem,env(safe-area-inset-bottom))]">${body()}${cityStrip()}</main></div>`);
    tick();
  }
  function tick() {
    if (!state) return;
    if (state.phase === 'voting') {
      const left = Math.max(0, state.endsAt - transport.now()), sec = Math.ceil(left / 1000);
      const t = $('#tTime'); if (t) { t.textContent = sec; t.style.color = sec <= 10 ? '#b02229' : ''; }
      const b = $('#tBar'); if (b) { b.style.width = (left / (state.durationMs || 1) * 100) + '%'; b.className = 'h-full rounded-full ' + (sec <= 10 ? 'bg-rose-500' : 'bg-emerald-500'); }
      const over = left <= 0; if (over !== wasOver) { wasOver = over; render(); }
    } else wasOver = false;
    const on = hostOnline(); if (on !== lastHostOn) { lastHostOn = on; render(); }
  }
  async function cast(choice) {
    if (!state || state.phase !== 'voting' || myVote() || transport.now() >= state.endsAt) return;
    const vid = state.voteId;
    store.set(lockKey(vid), choice);
    if (navigator.vibrate) navigator.vibrate(60);
    render();
    try { await transport.set(`votes/${vid}/${tid}`, choice); acked = vid; }
    catch { store.del(lockKey(vid)); toast('Your vote didn’t send. Tap again to retry.', 'error'); }
    render();
  }

  teardown.push(transport.on('state', v => { state = normalizeState(v); syncMine(); render(); }));
  teardown.push(transport.on('hostSeen', v => { hostSeen = v || 0; const on = hostOnline(); if (on !== lastHostOn) { lastHostOn = on; render(); } }));
  transport.onConnection(c => { connected = c; if (c) reg(); render(); });
  const loop = setInterval(tick, 250); teardown.push(() => clearInterval(loop));

  const onClick = e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    if (b.dataset.act === 'yes') cast('yes');
    else if (b.dataset.act === 'no') cast('no');
    else if (b.dataset.act === 'leave') { if (!state || confirm('Leave this room?')) showLanding(); }
  };
  app.addEventListener('click', onClick); teardown.push(() => app.removeEventListener('click', onClick));

  syncMine(); render();
}

/* ════════════════════════════════════════════════════════════════════════════
   BOOT
   ════════════════════════════════════════════════════════════════════════════ */
showLanding();
</script>
</body>
</html>
