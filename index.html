const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const fmt = n => (n < 0 ? '-$' : '$') + Math.round(Math.abs(n)).toLocaleString('en-US');
const fmtShort = n => {
  const a = Math.abs(n);
  if (a >= 1e6) return '$' + (n / 1e6).toFixed(n % 1e6 === 0 ? 0 : 1) + 'M';
  if (a >= 1e3) return '$' + Math.round(n / 1e3) + 'K';

};

const slug = s => String(s).toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'table';

const toArr = v => Array.isArray(v) ? v.filter(Boolean) : (v && typeof v === 'object') ? Object.keys(v).sort((a, b) => a - b).map(k => v[k]) : [];
const hash = str => { let h = 5381; for (let i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) | 0; return Math.abs(h); };
const natSort = (a, b) => a.name.localeCompare(b.name, undefined, { numeric: true });

const mem = {};
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return k in mem ? mem[k] : d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { mem[k] = v; } },
  del(k) { try { localStorage.removeItem(k); } catch { delete mem[k]; } }
};

function setMoney(el, val) {
  if (!el) return;
  if (el._v === undefined) { el._v = val; el.textContent = fmt(val); return; }
  if (el._v === val) return;
  const from = el._v, to = val; el._v = val;
  const t0 = performance.now(); cancelAnimationFrame(el._raf);
  const step = t => {
    const p = Math.min(1, (t - t0) / 800), e = 1 - Math.pow(1 - p, 3);
    el.textContent = fmt(from + (to - from) * e);
    if (p < 1) el._raf = requestAnimationFrame(step);
  };

}

/* Sound + confetti (host only) */

function beep(freq = 660, dur = .12, type = 'sine', vol = .08) {
  if (!soundOn) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq; g.gain.value = vol;
    o.connect(g); g.connect(actx.destination); o.start();

/* ════════════════════════════════════════════════════════════════════════════
   SYNC TRANSPORTS  (same interface: set/get/on/now/onConnection/close)
   ════════════════════════════════════════════════════════════════════════════ */
const getIn = (o, path) => path.split('/').filter(Boolean).reduce((a, k) => (a == null ? a : a[k]), o);
function setIn(o, path, val) {
  const ks = path.split('/').filter(Boolean);
  let cur = o;
  for (let i = 0; i < ks.length - 1; i++) { if (cur[ks[i]] == null || typeof cur[ks[i]] !== 'object') cur[ks[i]] = {}; cur = cur[ks[i]]; }
  if (val == null) delete cur[ks[ks.length - 1]]; else cur[ks[ks.length - 1]] = val;
}

/** Local demo transport: localStorage + BroadcastChannel (tabs in the same browser only). */
class LocalTransport {
  constructor(code) {
    this.mode = 'local'; this.code = code; this.key = 'civic:room:' + code; this.listeners = [];
    try { this.bc = new BroadcastChannel('civic:' + code); this.bc.onmessage = () => this._notify(); } catch {}
    this._onStorage = e => { if (e.key === this.key) this._notify(); };
    window.addEventListener('storage', this._onStorage);
  }
  _read() { return store.get(this.key, {}) || {}; }
  now() { return Date.now(); }
  set(path, val) {
    const root = this._read(); setIn(root, path, val == null ? null : JSON.parse(JSON.stringify(val)));
    store.set(this.key, root); this._notify(); try { this.bc && this.bc.postMessage(1); } catch {}
    return Promise.resolve();
  }
  get(path) { const v = getIn(this._read(), path); return Promise.resolve(v === undefined ? null : v); }
  on(path, cb) {
    const l = { path, cb, last: undefined }; this.listeners.push(l);
    setTimeout(() => this._notify(), 0);
    return () => { this.listeners = this.listeners.filter(x => x !== l); };
  }
  _notify() {
    const root = this._read();
    this.listeners.slice().forEach(l => {
      const v = getIn(root, l.path), val = v === undefined ? null : v, s = JSON.stringify(val);
      if (s !== l.last) { l.last = s; l.cb(val); }
    });
  }
  onConnection(cb) { cb(true); }
  close() { try { this.bc && this.bc.close(); } catch {} window.removeEventListener('storage', this._onStorage); this.listeners = []; }
}

/** Firebase Realtime Database transport (compat SDK loaded on demand). */
class FirebaseTransport {
  constructor(code, cfg) {
    this.mode = 'firebase'; this.code = code; this.offset = 0; this.connected = false; this.connCbs = [];
    const app = firebase.apps.length ? firebase.app() : firebase.initializeApp(cfg);
    this.db = firebase.database(app);
    this._offRef = this.db.ref('.info/serverTimeOffset'); this._offRef.on('value', s => { this.offset = s.val() || 0; });
    this._conRef = this.db.ref('.info/connected');
    this._conRef.on('value', s => { this.connected = !!s.val(); this.connCbs.forEach(f => f(this.connected)); });
  }
  now() { return Date.now() + this.offset; }
  ref(p) { return this.db.ref('rooms/' + this.code + (p ? '/' + p : '')); }
  set(p, v) { return v == null ? this.ref(p).remove() : this.ref(p).set(JSON.parse(JSON.stringify(v))); }
  get(p) { return this.ref(p).once('value').then(s => s.val()); }
  on(p, cb) { const r = this.ref(p), h = s => cb(s.val()); r.on('value', h); return () => r.off('value', h); }
  onConnection(cb) { this.connCbs.push(cb); cb(this.connected); }
  close() { this.connCbs = []; try { this._offRef.off(); this._conRef.off(); } catch {} }
}

const getFirebaseConfig = () => FIREBASE_CONFIG || store.get('civic:fb', null);
async function createTransport(code) {
  const cfg = getFirebaseConfig();
  if (cfg && cfg.databaseURL) {
    if (!(window.firebase && firebase.apps)) {
      await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js');
      await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js');
    }
    return new FirebaseTransport(code, cfg);
  }
  return new LocalTransport(code);
}

  if (!s || typeof s !== 'object') return null;

  s.spent = s.spent || 0; s.idx = s.idx || 0;

const gridDims = s => ({ cols: COLS, rows: Math.max(5, Math.ceil((s.queue.length + (s.baseline ? 4 : 0)) / COLS)) });
function baselineTiles(rows) {

function fillOrder(code, rows, baseline) {
  const base = new Set(baseline ? baselineTiles(rows).map(t => t.r * COLS + t.c) : []);
  const cr = (rows - 1) / 2, cc = (COLS - 1) / 2, arr = [];
  for (let r = 0; r < rows; r++) for (let c = 0; c < COLS; c++) {
    const idx = r * COLS + c; if (base.has(idx)) continue;
    arr.push([Math.hypot(r - cr, (c - cc) * .8) + (hash(code + ':' + idx) % 100) / 100 * .9, idx]);
  }
  return arr.sort((a, b) => a[0] - b[0]).map(x => x[1]);
}

   HOST / MAIN PRESENTATION SCREEN
   ════════════════════════════════════════════════════════════════════════════ */
async function showHost(code, initial, isNew) {
  cleanup();
  app.innerHTML = splash('Opening room…');
  let transport, state = initial;
  try {
    transport = await createTransport(code);
    teardown.push(() => transport.close());
    if (isNew) {
      for (let n = 0; n < 5; n++) {
        const ex = await timeout(transport.get('state'), 8000);
        if (!ex) break;
        code = genCode(); transport.close(); transport = await createTransport(code);
        teardown.length = 0; teardown.push(() => transport.close());
      }
      state.code = code;
      await timeout(transport.set('tables', null), 8000); await timeout(transport.set('votes', null), 8000);
      await timeout(transport.set('state', state), 8000);
    } else {
      state = normalizeState(await timeout(transport.get('state'), 8000));
      if (!state) { showLanding(`Room ${code} is no longer available. Launch a new host screen.`); return; }
    }
  } catch (err) {

  function renderConn() {
    const n = tableList().filter(t => t.online).length;
    setHTML($('#hConn'), `<span class="inline-flex items-center gap-1.5"><span class="w-2 h-2 rounded-full ${connected ? 'bg-emerald-400' : 'bg-rose-500 animate-pulse'}"></span>${transport.mode === 'firebase' ? (connected ? 'Live sync' : 'Reconnecting…') : 'Local demo'}</span><span class="text-slate-500">|</span><span>${n} ${n === 1 ? 'table' : 'tables'} online</span>`);
    $('#hSound').textContent = soundOn ? '🔊' : '🔇';
  }
  function renderAll() { renderBudget(); renderItem(); renderVote(); renderNext(); renderCity(); renderOverlay(); renderConn(); }

  /* ---- timer / loop ---- */
  function tick(renderOnly) {
    const now = transport.now();
    if (state.phase === 'voting') {
      const left = Math.max(0, state.endsAt - now), sec = Math.ceil(left / 1000);
      const t = $('#vTime'); if (t) { t.textContent = sec; t.className = t.className.replace(/text-(white|rose-400)/, sec <= 10 ? 'text-rose-400' : 'text-white'); }
      const b = $('#vBar'); if (b) { b.style.width = (left / (state.durationMs || 1) * 100) + '%'; b.className = 'h-full rounded-full ' + (sec <= 10 ? 'bg-rose-400' : 'bg-emerald-400'); }
      if (renderOnly) return;
      if (sec <= 5 && sec > 0 && sec !== lastBeep) { lastBeep = sec; beep(880, .08, 'square', .04); }
      if (left <= 0) { endVote(); return; }
      if (state.autoEnd) {
        const voted = Object.keys(votes?.[state.voteId] || {}).length, online = tableList().filter(x => x.online).length;
        if (voted > 0 && voted >= online) { if (!allVotedAt) allVotedAt = now; else if (now - allVotedAt > 1200) endVote(); } else allVotedAt = 0;
      }
    } else if (state.phase === 'result' && !renderOnly) {
      if (state.autoContinue > 0 && !autoPaused && performance.now() - resultShownAt > state.autoContinue * 1000) continueAfterResult();
    }
    if (!renderOnly && performance.now() - lastSlow > 1500) { lastSlow = performance.now(); renderVote(); renderConn(); }
  }

  /* ---- listeners ---- */
  teardown.push(transport.on('tables', v => { tables = v || {}; renderVote(); renderConn(); }));
  teardown.push(transport.on('votes', v => { votes = v || {}; renderVote(); }));
  transport.onConnection(c => { connected = c; renderConn(); });
  const beat = () => Promise.resolve(transport.set('hostSeen', transport.now())).catch(() => {});
  beat(); const hb = setInterval(beat, HEARTBEAT_MS); teardown.push(() => clearInterval(hb));
  const loop = setInterval(() => tick(false), 200); teardown.push(() => clearInterval(loop));

  const onChange = e => { if (e.target.id === 'vDur') { durSec = +e.target.value; } };
  const onClick = e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    b.blur && b.blur();
    switch (b.dataset.act) {
      case 'start': startVote(); break;
      case 'end': endVote(); break;
      case 'continue': continueAfterResult(); break;
      case 'pause': autoPaused = true; $('#autoBar')?.remove(); $('#pauseBtn')?.remove(); break;
      case 'skip': skipItem(); break;
      case 'sound': soundOn = !soundOn; store.set('civic:sound', soundOn); renderConn(); beep(660); break;
      case 'fs': if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen?.().catch(() => {}); break;
      case 'summary': finishedDismissed = false; $('#hOverlay')._sig = null; renderOverlay(); break;
      case 'closeSummary': finishedDismissed = true; renderOverlay(); $('#hOverlay').innerHTML = ''; $('#hOverlay')._sig = 'x'; break;
      case 'newSession': if (confirm('Start a new session? This closes the current room.')) { transport.set('state', null); showSetup(); } break;
      case 'join': openJoinModal(); break;
      case 'menu': openMenu(); break;
    }
  };
  const onKey = e => {
    if (/^(INPUT|SELECT|TEXTAREA|BUTTON)$/.test(e.target.tagName)) return;
    if (document.querySelector('.fixed.z-\\[80\\]')) return;
    if ([' ', 'Enter', 'ArrowRight', 'PageDown'].includes(e.key)) {
      e.preventDefault();
      if (state.phase === 'idle') startVote(); else if (state.phase === 'result') continueAfterResult();
      else if (state.phase === 'voting' && e.key === 'Enter' && e.shiftKey) endVote();
    }
  };
  app.addEventListener('click', onClick); app.addEventListener('change', onChange); document.addEventListener('keydown', onKey);
  teardown.push(() => { app.removeEventListener('click', onClick); app.removeEventListener('change', onChange); document.removeEventListener('keydown', onKey); });

  function openMenu() {
    const m = openModal(`<div class="p-6">
      <div class="flex items-center justify-between mb-4"><h2 class="font-display text-xl font-bold">Session controls</h2><button data-close class="btn btn-light !px-3 !py-1.5">✕</button></div>
      <div class="space-y-2">
        <button id="mSkip" class="btn btn-light w-full !justify-start">↷ Skip current item (move it to the end of the queue)</button>
        <button id="mFinish" class="btn btn-light w-full !justify-start">🏁 Finish session now</button>
        <button id="mNew" class="btn btn-light w-full !justify-start">⟲ Close room and start a new setup</button>
        <button id="mExit" class="btn btn-light w-full !justify-start">⏏ Leave to home screen (room stays open)</button>
      </div></div>`);
    $('#mSkip', m).onclick = () => { m.close(); skipItem(); };
    $('#mFinish', m).onclick = () => { m.close(); if (state.phase === 'idle') finishSession(); else toast('Wait for the current vote to finish first'); };
    $('#mNew', m).onclick = () => { m.close(); if (confirm('Close this room and start a new setup?')) { transport.set('state', null); store.del('civic:lastHost'); showSetup(); } };
    $('#mExit', m).onclick = () => { m.close(); showLanding(); };
  }
  function openJoinModal() {
    const url = location.href.split('#')[0] + '#join=' + code;
    const m = openModal(`<div class="p-7 text-center">
      <div class="flex justify-end"><button data-close class="btn btn-light !px-3 !py-1.5">✕</button></div>
      <div class="text-slate-500 font-semibold">Open this page on your device, tap “Vote from a table” and enter</div>
      <div class="num text-7xl md:text-8xl font-bold tracking-[.25em] text-slate-900 mt-2 pl-[.25em]">${esc(code)}</div>
      <div id="qr" class="mx-auto mt-5 w-[220px] h-[220px] grid place-items-center"></div>
      <div class="text-xs text-slate-500 mt-3 break-all">${esc(url)}</div>
      ${transport.mode === 'local' ? '<div class="mt-4 text-sm rounded-xl bg-amber-50 text-amber-800 p-3">Local demo mode: only other tabs in this browser can join. Connect Firebase in ⚙ Sync settings (home screen) for real devices.</div>' : ''}
    </div>`, 'max-w-md');
    loadScript('https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js')
      .then(() => { new QRCode($('#qr', m), { text: url, width: 220, height: 220, correctLevel: QRCode.CorrectLevel.M }); })
      .catch(() => { $('#qr', m).innerHTML = '<div class="text-sm text-slate-400">QR code unavailable offline</div>'; });
  }

  renderAll(); tick(true);
}

/* ════════════════════════════════════════════════════════════════════════════
   TABLE VOTING SCREEN
   ════════════════════════════════════════════════════════════════════════════ */
async function showTable(code, name) {
  cleanup();
  app.innerHTML = splash('Joining room ' + code + '…');
  let transport, state;
  try { transport = await createTransport(code); teardown.push(() => transport.close()); }
  catch (e) { showLanding('Could not start sync: ' + e.message); return; }
  try { state = normalizeState(await timeout(transport.get('state'), 8000)); }
  catch { showLanding('Could not reach the room. Check your connection and try again.'); return; }
  if (!state) {
    showLanding(`Room ${code} wasn’t found. Check the code on the main screen.` + (transport.mode === 'local' ? ' Local demo mode only reaches other tabs in this browser. Turn on live sync in ⚙ for separate devices.' : ''));
    return;
  }
  store.set('civic:lastTable', { code, name });
  const tid = slug(name);
  const lockKey = vid => `civic:vote:${code}:${vid}:${tid}`;
  let hostSeen = 0, connected = true, remoteVote = null, voteKey = null, unsubMine = null, acked = null, wasOver = false, lastHostOn = null, lastSlow = 0;

  const reg = () => Promise.resolve(transport.set('tables/' + tid, { name, lastSeen: transport.now() })).catch(() => {});
  reg(); const hb = setInterval(reg, HEARTBEAT_MS); teardown.push(() => clearInterval(hb));
  teardown.push(() => unsubMine && unsubMine());

  const myVote = () => (state && state.voteId && store.get(lockKey(state.voteId), null)) || remoteVote;
  const hostOnline = () => transport.now() - hostSeen < STALE_MS;

  function syncMine() {
    if (!state || state.voteId === voteKey) return;
    unsubMine && unsubMine(); voteKey = state.voteId; remoteVote = null; acked = null;
    if (voteKey) unsubMine = transport.on(`votes/${voteKey}/${tid}`, v => { remoteVote = v || null; if (v) acked = voteKey; render(); });
  }

  app.innerHTML = `<div id="tRoot" class="min-h-screen bg-grid"></div>`;
  const root = $('#tRoot');

  function header() {
    const on = connected && hostOnline();
    return `<header class="flex items-center justify-between gap-3 px-4 pt-[max(1rem,env(safe-area-inset-top))] pb-3">
      <div class="flex items-center gap-2 min-w-0"><span class="chip bg-emerald-400 text-emerald-950 !text-sm !px-3 !py-1 truncate max-w-[12rem]">${esc(name)}</span><span class="num text-white font-bold tracking-widest">${esc(code)}</span></div>
      <div class="flex items-center gap-3"><span class="inline-flex items-center gap-1.5 text-xs font-semibold ${on ? 'text-emerald-300' : 'text-amber-300'}"><span class="w-2 h-2 rounded-full ${on ? 'bg-emerald-400' : 'bg-amber-400 animate-pulse'}"></span>${!connected ? 'Reconnecting…' : hostOnline() ? 'Connected' : 'Host offline'}</span>
      <button data-act="leave" class="text-xs text-slate-400 underline">Leave</button></div></header>`;
  }
  function budgetCard(extra = '') {
    const rem = remaining(state), pct = Math.max(0, Math.min(100, rem / state.startingBudget * 100));
    return `<div class="card p-5">
      <div class="flex justify-between items-end gap-3">
        <div><div class="text-xs font-semibold text-slate-500">City budget remaining</div><div class="num text-4xl md:text-5xl font-bold ${rem <= 0 ? 'text-rose-600' : 'text-emerald-600'}">${fmt(rem)}</div></div>
        <div class="text-right"><div class="text-xs font-semibold text-slate-500">Spent</div><div class="num text-xl font-bold text-rose-600">${fmt(state.spent)}</div></div>
      </div>
      <div class="h-2.5 rounded-full bg-rose-100 overflow-hidden mt-3"><div class="h-full ${pct < 15 ? 'bg-amber-500' : 'bg-emerald-500'}" style="width:${pct}%"></div></div>${extra}</div>`;
  }
  function itemHeader(it, big) {
    const c = catColor(it.category);
    return `<div class="flex items-center gap-4"><div class="${big ? 'w-24 h-24 text-6xl' : 'w-16 h-16 text-4xl'} shrink-0 rounded-2xl grid place-items-center" style="background:${c}1f;border:2px solid ${c}66">${iconHTML(it.icon)}</div>
      <div class="min-w-0"><span class="chip" style="background:${c}26;border-color:${c}">${esc(it.category)}</span><h2 class="font-display text-2xl md:text-3xl font-bold leading-tight mt-1">${esc(it.name)}</h2></div></div>`;
  }
  function cityStrip() {
    const p = state.placed;
    return `<div class="panel p-4 mt-auto"><div class="text-xs font-semibold text-slate-400 mb-2">Your city so far · ${p.length} ${p.length === 1 ? 'project' : 'projects'}</div>
      <div class="flex flex-wrap gap-1.5">${p.length ? p.map(x => `<span class="w-10 h-10 rounded-xl grid place-items-center text-2xl" style="background:${catColor(x.category)}2e;border:1.5px solid ${catColor(x.category)}88" title="${esc(x.name)}">${iconHTML(x.icon)}</span>`).join('') : '<span class="text-sm text-slate-500">Nothing built yet.</span>'}</div></div>`;
  }

  function body() {
    const s = state, it = s.queue[s.idx];
    const mine = myVote();

    if (s.phase === 'voting' && it) {
      const rem = remaining(s), after = rem - it.cost, pct = Math.min(999, Math.round(it.cost / Math.max(rem, 1) * 100));
      const over = transport.now() >= s.endsAt;
      let action;
      if (mine) {
        action = `<div class="card p-6 text-center pop flex-1 grid place-items-center">
          <div><div class="check-pop mx-auto w-24 h-24 rounded-full grid place-items-center text-6xl text-white ${mine === 'yes' ? 'bg-emerald-500' : 'bg-rose-500'}">✓</div>
          <h3 class="font-display text-3xl font-bold mt-4">Vote locked!</h3>
          <p class="text-lg mt-1">Your table voted <b class="${mine === 'yes' ? 'text-emerald-600' : 'text-rose-600'}">${mine === 'yes' ? 'YES' : 'NO'}</b></p>
          <p class="text-slate-500 mt-3">Waiting for results<span class="dot-a">.</span><span class="dot-b">.</span><span class="dot-c">.</span></p>
          <p class="text-xs mt-2 ${acked === s.voteId ? 'text-emerald-600' : 'text-amber-600'}">${acked === s.voteId || transport.mode === 'local' ? '✓ Received' : 'Sending…'}</p></div></div>`;
      } else if (over) {
        action = `<div class="card p-6 text-center flex-1 grid place-items-center"><div><div class="text-5xl mb-2">⏱️</div><h3 class="font-display text-2xl font-bold">Time’s up</h3><p class="text-slate-500 mt-1">Counting the votes…</p></div></div>`;
      } else {
        action = `<div class="grid grid-cols-2 gap-4 flex-1 min-h-[42vh]">
          <button data-act="yes" class="vote-btn bg-emerald-500 text-4xl md:text-6xl"><span class="text-6xl md:text-8xl leading-none">👍</span>YES<span class="text-sm md:text-lg font-semibold opacity-90">Fund it</span></button>
          <button data-act="no" class="vote-btn bg-rose-500 text-4xl md:text-6xl"><span class="text-6xl md:text-8xl leading-none">👎</span>NO<span class="text-sm md:text-lg font-semibold opacity-90">Pass on it</span></button></div>`;
      }
      return `<div class="card p-5 pop">${itemHeader(it, false)}
          <div class="grid grid-cols-2 gap-3 mt-4">
            <div class="rounded-2xl bg-slate-100 p-3"><div class="text-xs font-semibold text-slate-500">Cost</div><div class="num text-2xl font-bold">${fmt(it.cost)}</div><div class="text-xs text-slate-500">${pct}% of what’s left</div></div>
            <div class="rounded-2xl ${after < 0 ? 'bg-amber-50' : 'bg-emerald-50'} p-3"><div class="text-xs font-semibold text-slate-500">Left if approved</div><div class="num text-2xl font-bold ${after < 0 ? 'text-amber-600' : 'text-emerald-600'}">${after < 0 ? 'Over budget' : fmt(after)}</div></div>
          </div>
          <div class="flex items-center gap-3 mt-4"><div class="num text-2xl font-bold w-12" id="tTime">--</div><div class="flex-1 h-3 rounded-full bg-slate-200 overflow-hidden"><div id="tBar" class="h-full rounded-full bg-emerald-500" style="width:100%"></div></div></div></div>
        ${action}`;
    }

    if (s.phase === 'result' && s.result) {
      const r = s.result;
      return `<div class="rounded-[2rem] overflow-hidden pop ${r.passed ? 'bg-emerald-500' : 'bg-rose-500'} text-white p-6 text-center shadow-2xl">
          <div class="text-6xl">${r.passed ? '🎉' : '✋'}</div>
          <div class="font-display text-4xl md:text-5xl font-bold mt-1">${r.passed ? 'Passed!' : 'Did not pass'}</div>
          <div class="font-semibold opacity-95 mt-1">${esc(r.reason)}</div></div>
        <div class="card p-5 pop">${itemHeader(r, false)}
          <div class="grid grid-cols-2 gap-3 mt-4">
            <div class="rounded-2xl bg-emerald-50 p-3 text-center"><div class="text-xs font-bold text-emerald-700">Yes</div><div class="num text-4xl font-bold text-emerald-600">${r.yes}</div></div>
            <div class="rounded-2xl bg-rose-50 p-3 text-center"><div class="text-xs font-bold text-rose-700">No</div><div class="num text-4xl font-bold text-rose-600">${r.no}</div></div></div>
          <div class="text-sm text-slate-500 mt-3 text-center">${mine ? `Your table voted <b class="${mine === 'yes' ? 'text-emerald-600' : 'text-rose-600'}">${mine.toUpperCase()}</b>` : 'Your table didn’t vote on this one'} · ${r.passed ? `${fmt(r.cost)} added to the city` : 'Budget unchanged'}</div></div>
        ${budgetCard()}`;
    }

    if (s.phase === 'finished') {
      return `<div class="card p-6 text-center pop"><div class="text-6xl">🏆</div><h2 class="font-display text-3xl font-bold mt-2">Session complete</h2>
        <p class="text-slate-500 mt-1">${s.placed.length} ${s.placed.length === 1 ? 'project was' : 'projects were'} funded, and ${fmt(remaining(s))} is left.</p></div>${budgetCard()}`;
    }

    // idle
    const last = s.result && s.decisions.length
      ? `<div class="panel p-4 flex items-center gap-3"><span class="text-2xl">${s.result.passed ? '✅' : '❌'}</span><div class="min-w-0"><div class="text-xs font-semibold text-slate-400">Last decision</div><div class="font-semibold text-white truncate">${esc(s.result.name)} ${s.result.passed ? 'passed' : 'did not pass'} (${s.result.yes}–${s.result.no})</div></div></div>` : '';
    return `${budgetCard()}
      <div class="card p-6 text-center pop"><div class="text-5xl mb-2">⏳</div><h2 class="font-display text-2xl font-bold">Waiting for the next vote</h2>
        <p class="text-slate-500 mt-1">Keep this screen open. It updates the moment the host starts.</p>
        ${it ? `<div class="mt-4 rounded-2xl bg-slate-100 p-3 flex items-center gap-3 text-left"><span class="text-3xl">${iconHTML(it.icon)}</span><div class="min-w-0"><div class="text-xs font-semibold text-slate-500">Up next</div><div class="font-bold truncate">${esc(it.name)}</div></div><div class="num font-bold ml-auto">${fmtShort(it.cost)}</div></div>` : ''}</div>${last}`;
  }

  function render() {
    if (!state) { setHTML(root, `<div class="min-h-screen grid place-items-center p-6 text-center"><div><div class="text-5xl mb-3">👋</div><div class="text-white font-display text-2xl font-bold">The host closed this session</div><button data-act="leave" class="btn btn-green mt-5">Back to home</button></div></div>`); return; }
    setHTML(root, `<div class="min-h-screen flex flex-col max-w-xl md:max-w-2xl mx-auto w-full">${header()}<main class="flex-1 flex flex-col gap-4 px-4 pb-[max(1.5rem,env(safe-area-inset-bottom))]">${body()}${cityStrip()}</main></div>`);
    tick();
  }

  function tick() {
    if (!state) return;
    if (state.phase === 'voting') {
      const left = Math.max(0, state.endsAt - transport.now()), sec = Math.ceil(left / 1000);
      const t = $('#tTime'); if (t) { t.textContent = sec; t.style.color = sec <= 10 ? '#e11d48' : ''; }
      const b = $('#tBar'); if (b) { b.style.width = (left / (state.durationMs || 1) * 100) + '%'; b.className = 'h-full rounded-full ' + (sec <= 10 ? 'bg-rose-500' : 'bg-emerald-500'); }
      const over = left <= 0; if (over !== wasOver) { wasOver = over; render(); }
    } else wasOver = false;
    const on = hostOnline(); if (on !== lastHostOn) { lastHostOn = on; render(); }
  }

  async function cast(choice) {
    if (!state || state.phase !== 'voting' || myVote() || transport.now() >= state.endsAt) return;
    const vid = state.voteId;
    store.set(lockKey(vid), choice);
    if (navigator.vibrate) navigator.vibrate(60);
    render();
    try { await transport.set(`votes/${vid}/${tid}`, choice); acked = vid; }
    catch { store.del(lockKey(vid)); toast('Your vote didn’t send. Tap again to retry.', 'error'); }
    render();
  }

  teardown.push(transport.on('state', v => { state = normalizeState(v); syncMine(); render(); }));
  teardown.push(transport.on('hostSeen', v => { hostSeen = v || 0; const on = hostOnline(); if (on !== lastHostOn) { lastHostOn = on; render(); } }));
  transport.onConnection(c => { connected = c; if (c) reg(); render(); });
  const loop = setInterval(tick, 250); teardown.push(() => clearInterval(loop));

  const onClick = e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    if (b.dataset.act === 'yes') cast('yes');
    else if (b.dataset.act === 'no') cast('no');
    else if (b.dataset.act === 'leave') { if (!state || confirm('Leave this room?')) showLanding(); }
  };
  app.addEventListener('click', onClick); teardown.push(() => app.removeEventListener('click', onClick));

  syncMine(); render();
}

/* ════════════════════════════════════════════════════════════════════════════
   BOOT
   ════════════════════════════════════════════════════════════════════════════ */
showLanding();
</script>
</body>
</html>
